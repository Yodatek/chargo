stages:
  - validate
  - package
  - deploy

# Nothing here is hardcoded to one instance: every URL comes from a predefined variable, so this file is
# identical wherever the project is mirrored.

# Lint, render, then PARSE the rendered manifest. The chart emits nothing but ArgoCD objects, so the checks
# that matter are structural: documents actually separated, and every by-name reference resolving.
# Both credential shapes are exercised — literal and store pointer go through different branches of every
# secret-bearing template. See hack/validate-render.py.
helm:validate:
  stage: validate
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  before_script:
    - apk add --no-cache python3 py3-yaml
  script:
    - helm lint . -f values.example.yaml
    - helm lint . -f values.example-external.yaml
    - helm template chargo . -f values.example.yaml > rendered-internal.yaml
    - python3 hack/validate-render.py rendered-internal.yaml
    - helm template chargo . -f values.example-external.yaml > rendered-external.yaml
    - python3 hack/validate-render.py rendered-external.yaml
  artifacts:
    when: on_failure
    paths:
      - rendered-internal.yaml
      - rendered-external.yaml
    expire_in: 1 week

# docs/logo.svg and docs/banner.svg are generated: the tapered arms are ~60-point polygons nobody edits by
# hand. Fails if someone edited the output instead of docs/build-logo.py.
logo:drift:
  stage: validate
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git
  script:
    - python3 docs/build-logo.py
    - git diff --exit-code -- docs/

helm:package:
  stage: package
  needs: ["helm:validate"]
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  script:
    - helm package .
  artifacts:
    paths:
      - chargo-*.tgz
  rules:
    - if: $CI_COMMIT_TAG

# The tag must match `version` in Chart.yaml — publishing a version nobody asked for is worse than failing.
helm:deploy:
  stage: deploy
  needs: ["helm:package"]
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl yq
    - export VERSION="$(yq '.version' Chart.yaml)"
  script:
    - test "v${VERSION}" = "${CI_COMMIT_TAG}" || { echo "tag ${CI_COMMIT_TAG} != Chart.yaml ${VERSION}"; exit 1; }
    - |
      curl --fail --request POST --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
        --form "chart=@chargo-${VERSION}.tgz" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"
  rules:
    - if: $CI_COMMIT_TAG
