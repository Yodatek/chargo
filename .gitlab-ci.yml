stages:
  - validate
  - package
  - deploy

# Nothing here is hardcoded to one instance: every URL comes from a predefined variable, so this file is
# identical wherever the project is mirrored.

# Lint, render, then PARSE the rendered manifest. The chart emits nothing but ArgoCD objects, so the checks
# that matter are structural: documents actually separated, and every by-name reference resolving.
# Both credential shapes are exercised — literal and store pointer go through different branches of every
# secret-bearing template. See hack/validate-render.py.
helm:validate:
  stage: validate
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  before_script:
    - apk add --no-cache python3 py3-yaml
  script:
    - helm lint . -f values.example.yaml
    - helm lint . -f values.example-external.yaml
    - helm template chargo . -f values.example.yaml > rendered-internal.yaml
    - python3 hack/validate-render.py rendered-internal.yaml
    - helm template chargo . -f values.example-external.yaml > rendered-external.yaml
    - python3 hack/validate-render.py rendered-external.yaml
  artifacts:
    when: on_failure
    paths:
      - rendered-internal.yaml
      - rendered-external.yaml
    expire_in: 1 week

# hack/bootstrap.sh installs chargo with nothing but bash, which is also what leaves it unguarded: no
# renderer, no type checker. shellcheck is the whole safety net.
shell:lint:
  stage: validate
  image:
    name: koalaman/shellcheck-alpine:v0.10.0
    entrypoint: [""]
  script:
    - shellcheck hack/*.sh

# docs/logo.svg and docs/banner.svg are generated: the tapered arms are ~60-point polygons nobody edits by
# hand. Fails if someone edited the output instead of docs/build-logo.py.
logo:drift:
  stage: validate
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git
  script:
    - python3 docs/build-logo.py
    - git diff --exit-code -- docs/

# The `version` in Chart.yaml is the trigger AND the single source of truth. A push to the default branch
# publishes it if, and only if, no tag carries it yet — so re-running on an unchanged version does nothing
# and a release is one commit, never a commit plus a tag someone has to remember.
#
# There is no tag to write by hand, so there is no tag that can disagree with Chart.yaml. The check this
# replaces compared `v$VERSION` against the tag and printed both WITHOUT the prefix, so a tag named
# `0.2.0` failed with `tag 0.2.0 != Chart.yaml 0.2.0`.
#
# Needs CI_RW_ACCESS_TOKEN — a project or group token with write_repository, which is what pushes the tag.
# CI_JOB_TOKEN cannot: it may publish a package, never write to the repository.
helm:release:
  stage: deploy
  needs: ["helm:validate"]
  image:
    name: alpine/helm:3.16.3
    entrypoint: [""]
  before_script:
    - apk add --no-cache git curl yq
    - export VERSION="$(yq '.version' Chart.yaml)"
  script:
    - |
      if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
        echo "v${VERSION} is already released — nothing to do."
        exit 0
      fi
    - helm package .
    - |
      curl --fail --request POST --user "gitlab-ci-token:${CI_JOB_TOKEN}" \
        --form "chart=@chargo-${VERSION}.tgz" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/helm/api/stable/charts"
    # The tag is a RECORD of what was published, written after the fact. It is also what makes the job
    # idempotent, so it is pushed last: a failed publish leaves no tag and the next run retries.
    - git config user.name "${GITLAB_USER_NAME}"
    - git config user.email "${GITLAB_USER_EMAIL}"
    - git tag -a "v${VERSION}" -m "Release ${VERSION}"
    - git push "https://gitlab-ci-token:${CI_RW_ACCESS_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "v${VERSION}"
  artifacts:
    paths:
      - chargo-*.tgz
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
