apiVersion: v2
name: chargo
description: Renders the ArgoCD objects of one platform — ApplicationSets, Applications, AppProjects and repository credentials
type: application
version: 0.2.0
appVersion: "0.2.0"
# Rendered by helm UIs and by ArgoCD. Points at the raw file of the default branch, so it follows the
# logo without a release. Regenerate with docs/build-logo.py.
icon: https://raw.githubusercontent.com/Yodatek/chargo/main/docs/logo.png
# What someone types into a chart registry's search box. `argo-cd` and `argocd` are both here because
# both spellings are searched.
keywords:
  - argocd
  - argo-cd
  - gitops
  - applicationset
  - appproject
  - continuous-delivery
home: https://github.com/Yodatek/chargo
sources:
  - https://github.com/Yodatek/chargo
maintainers:
  - name: Yodatek
    url: https://github.com/Yodatek
# Read by Artifact Hub, which is where a Helm chart is searched for. Unknown keys are ignored, so a
# registry that does not know them renders the chart unchanged.
annotations:
  artifacthub.io/category: integration-delivery
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: source
      url: https://github.com/Yodatek/chargo
    - name: changelog
      url: https://github.com/Yodatek/chargo/blob/main/CHANGELOG.md
    - name: support
      url: https://github.com/Yodatek/chargo/issues
  # Artifact Hub cannot read CHANGELOG.md, so the headline of each release is repeated here. It is part
  # of the release commit: a `version` bump that leaves this block on the previous release publishes a
  # package page describing the wrong version.
  artifacthub.io/changes: |
    - kind: added
      description: hack/bootstrap.sh installs chargo into an ArgoCD instance with nothing but bash
    - kind: added
      description: Contributing, security and conduct files, a changelog, and issue templates
    - kind: added
      description: home, sources and maintainers in Chart.yaml, so registries point back at the project
    - kind: added
      description: shellcheck job in CI, guarding hack/
    - kind: changed
      description: "Breaking: releaseName of a registryChart defaults to the App name, not to the app prefix"
    - kind: changed
      description: A release is one commit — version in Chart.yaml triggers it, the tag is written after
    - kind: fixed
      description: hack/validate-render.py accepts several files, so an --output-dir tree is one render
