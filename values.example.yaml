# EXAMPLE — the `int` platform with placeholder material. Rendered by CI (`helm template . -f
# values.example.yaml`) so every shape the chart supports stays exercised: an ApplicationSet over a chart,
# one over raw manifests, one whose leaves declare their own chart, and a standalone Application.
#
# The real per-platform files live in the deploying repo, where the material is either vaulted or replaced
# by a {key, property} pointer.

global:
  platform: int
  argocdNamespace: argocd
  revision: main

credentials:
  # One forge token for two uses: cloning the content repositories, and pulling charts from the helm
  # registry. Rotating it touches this entry only. No registry identity here — the pull secret belongs to
  # the chart that owns the workload.
  #
  # A literal password: this file would be SOPS-encrypted, or rendered from Ansible vault. See
  # values.example-external.yaml for the same credential as a pointer.
  gitlab-forge:
    username: CAPTAIN_RIMAFLOWA
    password: PLACEHOLDER

repositories:
  content-wetemplates:
    type: git
    url: https://gitlab.forge.berger-levrault.com/bu-collectivites/avenir/we-templates/argocd-apps.git
    credentials: gitlab-forge

  # Platform `int` reads the repository named `internal`: the platform name and the repository name are
  # unrelated, which is exactly why the URL is declared rather than derived.
  content-devsecops:
    type: git
    url: https://gitlab.forge.berger-levrault.com/bu-collectivites/avenir/devsecops/gitops/argocd/internal.git
    credentials: gitlab-forge

  we-chart:
    type: helm
    url: https://gitlab.forge.berger-levrault.com/api/v4/projects/5599/packages/helm/stable
    name: we-chart
    version: "3.0.0"
    credentials: gitlab-forge

applicationsets:
  # --- One chart, many leaves ---------------------------------------------------------------------
  # dev/values.yaml → App wetemp-dev (ns wetemp-dev); dev/redis/values.yaml → App wetemp-dev-redis, same
  # namespace. What changes per platform is this discovery scope, not the content repository.
  # The pull secret is we-chart's business: its leaves declare `global.pullSecrets`.
  wetemp:
    project: wetemp
    contentRepo: content-wetemplates
    chartRepo: we-chart
    chartVersion: "3.0.0-1"
    discovery:
      include: [dev, test]
      valueFiles: [values.yaml, config.yaml, secrets.yaml]

  # --- Raw manifests ------------------------------------------------------------------------------
  # One App per directory under raw/, named after the tool rather than after the tree it sits in.
  # Destinations are wider than devsecops-* because the objects under raw/weresources carry their TARGET
  # namespace — a quota for wegf-dev lands in wegf-dev.
  # Secrets these objects need are declared WITH them, in the content repository: an ExternalSecret next to
  # the Deployment. Nothing about them appears here.
  devsecops:
    app: devsecops
    project: devsecops
    sourceType: directory
    naming: basename
    contentRepo: content-devsecops
    discovery:
      include: [raw/*]
    destinations:
      - namespace: "*"

  # --- Leaves declaring their own chart -------------------------------------------------------------
  # charts/<tool>/ IS a chart: its Chart.yaml lists the upstream chart as a dependency, so adding a tool is
  # a commit in the content repository and never a redeploy of this chart. Shares the `devsecops` prefix and
  # project with the entry above, hence the explicit object name.
  devsecops-charts:
    name: devsecops-charts
    app: devsecops
    project: devsecops
    sourceType: gitChart
    naming: basename
    contentRepo: content-devsecops
    discovery:
      include: [charts/*]
      leaf: Chart.yaml
      valueFiles: [values.yaml, config.yaml]
    destinations:
      - namespace: "*"

applications:
  # --- Two charts in ONE object -------------------------------------------------------------------
  # we-chart plus an upstream chart, each with its own FLAT values files, where an umbrella Chart.yaml
  # would nest every file under a subchart key. No generator: one path, one namespace.
  weresources:
    app: devsecops
    project: devsecops
    contentRepo: content-devsecops
    path: singleton/weresources
    namespace: devsecops-weresources
    charts:
      - repo: we-chart
        version: "3.0.0-1"
